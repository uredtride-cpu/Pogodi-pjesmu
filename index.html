<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pogodi pjesmu</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16122b">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: one-screen party app, phone-first. Top: score strip. Middle: stage (covered player). Bottom: one giant action. */
:root{
  --night:#16122b;      /* pozadina */
  --panel:#231d42;      /* plohe */
  --line:#3a3266;
  --cream:#f6efe1;      /* tekst */
  --muted:#a59fc4;
  --buzz:#e8402f;       /* STOP */
  --teamA:#f2b134;      /* tim 1 */
  --teamB:#3fc1b5;      /* tim 2 */
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--body);font-size:16px;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.app{height:100%;display:flex;flex-direction:column;gap:14px;max-width:520px;margin:0 auto;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
[hidden]{display:none!important}

/* score */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.team{background:var(--panel);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.team.b{text-align:right}
.team input{background:transparent;border:0;color:var(--muted);font:600 13px var(--body);letter-spacing:.06em;text-transform:uppercase;width:100%;padding:0}
.team.b input{text-align:right}
.team .pts{font:44px/1 var(--display);font-variant-numeric:tabular-nums}
.team.a .pts{color:var(--teamA)} .team.b .pts{color:var(--teamB)}
.round{font:600 12px var(--body);color:var(--muted);text-align:center;letter-spacing:.08em;text-transform:uppercase;line-height:1.3}
.round b{display:block;font:22px var(--display);color:var(--cream);letter-spacing:0}

/* stage */
.stage{position:relative;flex:1;min-height:220px;border-radius:20px;overflow:hidden;background:var(--panel)}
#player,#player iframe{position:absolute;inset:0;width:100%;height:100%}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:var(--panel);padding:20px;text-align:center;transition:opacity .35s}
.cover.gone{opacity:0;pointer-events:none}
.disc{width:min(46vw,170px);aspect-ratio:1;border-radius:50%;max-width:100%;
  background:repeating-radial-gradient(circle at 50% 50%,#2c2552 0 2px,#1b1636 2px 5px);
  position:relative;box-shadow:0 0 0 2px var(--line)}
.disc::after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--buzz);box-shadow:inset 0 0 0 6px #b52a1d}
.spin .disc{animation:spin 1.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin .disc{animation:none}}
.status{font:800 18px var(--body);text-wrap:balance}
.hint{color:var(--muted);font-size:14px;max-width:32ch;text-wrap:balance}

.answer{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;background:linear-gradient(transparent,rgba(10,8,22,.92) 35%)}
.answer .artist{font:600 15px var(--body);color:var(--muted)}
.answer .title{font:26px/1.1 var(--display);text-wrap:balance}
.answer .meta{font-size:12px;color:var(--muted);margin-top:4px}

/* controls */
.controls{display:flex;flex-direction:column;gap:10px}
.smash{height:min(30vh,170px);border-radius:24px;background:var(--buzz);color:#fff;font:clamp(40px,12vw,64px) var(--display);
  box-shadow:0 8px 0 #9e2418;transition:transform .06s,box-shadow .06s;letter-spacing:.02em}
.smash:active{transform:translateY(6px);box-shadow:0 2px 0 #9e2418}
.big{height:72px;border-radius:18px;background:var(--cream);color:var(--night);font:24px var(--display);box-shadow:0 6px 0 #c9bfa8}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #c9bfa8}
.award{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.award button{height:72px;border-radius:18px;font:20px var(--display);color:var(--night)}
.award .a{background:var(--teamA)} .award .b{background:var(--teamB)}
.row{display:flex;gap:10px}
.ghost{flex:1;height:46px;border-radius:14px;background:transparent;box-shadow:inset 0 0 0 2px var(--line);color:var(--muted);font-weight:600}

/* start + list screens */
.screen{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
h1{font:clamp(40px,13vw,58px)/.95 var(--display);margin:8px 0 0;text-wrap:balance}
h1 span{color:var(--buzz)}
.lead{color:var(--muted);margin:0;line-height:1.5;max-width:42ch}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.teams label{background:var(--panel);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.teams span{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase}
.teams label:first-child span{color:var(--teamA)} .teams label:last-child span{color:var(--teamB)}
.teams input{background:transparent;border:0;border-bottom:2px solid var(--line);color:var(--cream);font:20px var(--display);padding:2px 0;width:100%;min-width:0}
.teams input:focus{outline:none;border-color:var(--cream)}
.pick{display:flex;flex-direction:column;gap:8px}
.pick label{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border-radius:14px;padding:14px 16px;font-weight:800}
.pick label small{color:var(--muted);font-weight:600}
.pick input{accent-color:var(--buzz);width:20px;height:20px}
.pick label.off{opacity:.5}
.list{flex:1;overflow:auto;background:var(--panel);border-radius:14px;min-height:0}
.list table{width:100%;border-collapse:collapse;font-size:14px}
.list td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.list td:first-child{width:36px}
.list a{color:var(--teamB)}
.list .src{color:var(--muted);font-size:12px}
.spacer{flex:1}
.list td.sec{font:16px var(--display);color:var(--buzz);padding-top:16px;background:var(--night)}
.paste{display:block;width:100%;margin-top:6px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--night);color:var(--cream);font:14px var(--body)}
.ver{color:var(--teamA);font-weight:600}
.auto{background:var(--panel);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.auto label{font-weight:800}
.auto label small{color:var(--muted);font-weight:600}
.auto input{flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--night);color:var(--cream);font:15px var(--body)}
.auto .hint{max-width:none;text-align:left}
.mini{background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:13px}

/* izlaz */
.veil{position:fixed;inset:0;background:rgba(10,8,22,.85);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dialog{background:var(--panel);border-radius:20px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;width:100%;max-width:360px;text-align:center}
.dialog h2{font:26px var(--display);margin:0}
.dialog p{margin:0;color:var(--muted)}
</style>
</head>
<body>
<div class="app">

  <!-- START -->
  <section class="screen" id="startScreen">
    <h1>Pogodi <span>pjesmu</span></h1>
    <p class="lead">Dva tima, jedan mobitel. Pjesma kreće od nasumičnog mjesta. Tko prvi zna, udara STOP i odgovara naglas.</p>
    <div class="teams">
      <label for="teamA"><span>Tim 1</span><input id="teamA" maxlength="18" placeholder="npr. Jarići" autocomplete="off"></label>
      <label for="teamB"><span>Tim 2</span><input id="teamB" maxlength="18" placeholder="npr. Susjedi" autocomplete="off"></label>
    </div>
    <div class="pick" id="pick"></div>
    <div class="row">
      <button class="ghost" id="reviewBtn" type="button">Pregled pjesama</button>
    </div>
    <button class="ghost" id="installBtn" type="button" hidden>Dodaj na početni zaslon</button>
    <div class="spacer"></div>
    <small class="src" id="verLine" style="text-align:center"></small>
    <button class="big" id="startBtn" type="button">Kreni</button>
  </section>

  <!-- REVIEW -->
  <section class="screen" id="reviewScreen" hidden>
    <h1 style="font-size:34px">Pregled</h1>
    <p class="lead" id="reviewScope"></p>
    <div class="auto" id="summary"></div>
    <div class="list"><table><tbody id="reviewBody"></tbody></table></div>
    <button class="big" id="backBtn" type="button">Gotovo</button>
  </section>

  <!-- GAME -->
  <section class="screen" id="gameScreen" hidden>
    <div class="score">
      <div class="team a"><input id="nameA" value="Tim 1" aria-label="Ime tima 1"><span class="pts" id="ptsA">0</span></div>
      <div class="round">Runda<b id="roundNo">1</b><span id="left"></span></div>
      <div class="team b"><input id="nameB" value="Tim 2" aria-label="Ime tima 2"><span class="pts" id="ptsB">0</span></div>
    </div>

    <div class="stage">
      <div id="player"></div>
      <div class="cover" id="cover">
        <div class="disc"></div>
        <div class="status" id="status">Učitavam…</div>
        <div class="hint" id="hint"></div>
      </div>
      <div class="answer" id="answer" hidden>
        <div class="artist" id="aArtist"></div>
        <div class="title" id="aTitle"></div>
        <div class="meta" id="aMeta"></div>
      </div>
    </div>

    <div class="controls">
      <button class="smash" id="stopBtn" type="button">STOP</button>
      <button class="big" id="revealBtn" type="button" hidden>Prikaži odgovor</button>
      <div class="award" id="award" hidden>
        <button class="a" id="giveA" type="button">+1 Tim 1</button>
        <button class="b" id="giveB" type="button">+1 Tim 2</button>
      </div>
      <div class="row">
        <button class="ghost" id="resumeBtn" type="button" hidden>Nastavi pjesmu</button>
        <button class="ghost" id="skipBtn" type="button">Preskoči</button>
        <button class="ghost" id="menuBtn" type="button">Izbornik</button>
      </div>
    </div>
  </section>
</div>

<div class="veil" id="startVeil" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="startTitle">
    <h2 id="startTitle">Prošla igra nije gotova</h2>
    <p id="startInfo"></p>
    <button class="big" id="newGameBtn" type="button">Nova igra</button>
    <button class="ghost" id="continueBtn" type="button">Nastavi prošlu</button>
  </div>
</div>

<div class="veil" id="exitVeil" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="exitTitle">
    <h2 id="exitTitle">Izaći iz igre?</h2>
    <p>Rezultat ostaje spremljen.</p>
    <button class="big" id="stayBtn" type="button">Ostani</button>
    <button class="ghost" id="leaveBtn" type="button">Izađi u izbornik</button>
  </div>
</div>

<script src="data.js"></script>
<script>
/* ---------- STANJE ---------- */
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} }
};
let excluded = new Set(store.get("pp_excluded",[]));
let links = store.get("pp_links",{});
let linkMeta = store.get("pp_linkmeta",{});

/* Video koji YouTube odbije pustiti (obrisan / ugradnja zabranjena) ide u "blocked", ne u "excluded".
   Takva pjesma tada traži zamjenski link (automatska pretraga ili ručno), ne nestaje s popisa. */
const APP_VERSION = "2026-10-10 19:20";
let blocked = store.get("pp_blocked",{});
let server = {links: {}, blocked: {}};          // iz links.json (GitHub)
const isBad = id => !id || blocked[id] || server.blocked[id];
/* Redoslijed: tvoj zalijepljeni link > link koji je našao GitHub > ugrađeni link. Preskače blokirane. */
function eff(s){
  const k = keyOf(s), sl = server.links[k];
  if (links[k] && !isBad(links[k])) return {id: links[k], ...(linkMeta[k]||{}), mine: 1};
  if (sl && !isBad(sl.id)) return {...sl, auto: 1};
  if (s.id && !isBad(s.id)) return {id: s.id, ch: s.ch, v: s.v};
  return {id: null, hadOne: !!(links[k] || (sl && sl.id) || s.id)};
}
const idOf = s => eff(s).id;
const playable = l => l.songs.filter(s => idOf(s) && !excluded.has(idOf(s)));
function parseYT(v){
  v = (v||"").trim();
  const m = v.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([A-Za-z0-9_-]{11})/) || v.match(/^([A-Za-z0-9_-]{11})$/);
  return m ? m[1] : null;
}
let score = store.get("pp_score",{a:0,b:0,round:1,names:["Tim 1","Tim 2"]});
let selected = store.get("pp_lists",["90s"]);
let deck = [], current = null, player = null, ready = false, state = "idle";

const $ = id => document.getElementById(id);
const show = id => ["startScreen","reviewScreen","gameScreen"].forEach(s => $(s).hidden = s!==id);

/* ---------- START ---------- */
function renderPick(){
  $("pick").innerHTML = Object.entries(LISTS).map(([k,l]) => {
    const n = playable(l).length, missing = l.songs.filter(s=>!idOf(s)).length;
    const off = n===0;
    return `<label class="${off?'off':''}"><span>${l.name}<br><small>${n} pjesama · ${l.note}${missing?` · ${missing} čeka link`:''}</small></span>
      <input type="checkbox" id="list_${k}" data-k="${k}" ${selected.includes(k)&&!off?'checked':''} ${off?'disabled':''}></label>`;
  }).join("");
  $("pick").querySelectorAll("input").forEach(i => i.onchange = () => {
    selected = [...$("pick").querySelectorAll("input:checked")].map(x=>x.dataset.k);
    store.set("pp_lists",selected);
  });
}
function renderSummary(){
  const all = new Map(); shownLists().forEach(([,l]) => l.songs.forEach(s => all.set(keyOf(s), s)));
  const songs = [...all.values()];
  const ok = songs.filter(s => idOf(s) && !excluded.has(idOf(s))).length;
  const off = songs.filter(s => idOf(s) && excluded.has(idOf(s))).length;
  const blk = songs.filter(s => !idOf(s) && eff(s).hadOne).length;
  const localBlk = songs.filter(s => [links[keyOf(s)], server.links[keyOf(s)]?.id, s.id].some(id => id && blocked[id])).length;
  const none = songs.length - ok - off - blk;
  $("summary").innerHTML = `<b>${songs.length} pjesama u odabranim listama</b>
    <span class="hint">${ok} spremno za igru · ${off} isključio si ti · ${blk} YouTube ne pušta (GitHub traži zamjenu) · ${none} bez linka</span>
    ${(off||localBlk)?`<button class="ghost" id="restoreBtn" type="button">Vrati isključene na ovom mobitelu (${off+localBlk})</button>`:""}
    <span class="src">Verzija ${APP_VERSION}</span>`;
  const r = $("restoreBtn");
  if (r) r.onclick = () => { excluded = new Set(); blocked = {}; store.set("pp_excluded",[]); store.set("pp_blocked",{}); renderReview(); renderPick(); };
}
function renderReview(){
  renderSummary();
  const rows = [];
  if (!shownLists().length) rows.push(`<tr><td colspan="2">Nijedna lista nije odabrana. Vrati se i označi listu na početnom ekranu.</td></tr>`);
  for (const [lk,l] of shownLists()) {
    rows.push(`<tr><td colspan="2" class="sec">${l.name}</td></tr>`);
    l.songs.forEach((s,i) => {
      const m = eff(s), id = m.id, q = encodeURIComponent(s.a+" "+s.t);
      const linkCell = id
        ? `<a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">YouTube · ${m.ch||"tvoj link"}</a>${m.v?` · <b class="ver">${m.v}</b>`:""}${m.auto?` · <span class="src">našao GitHub</span>`:""}${m.mine?` · <button class="mini" data-clear="${lk}:${i}" type="button">ukloni moj link</button>`:''}`
        : `${m.hadOne ? `<span class="ver">YouTube ne dopušta ovaj video u igri, GitHub traži zamjenu</span><br>` : `<span class="src">GitHub još traži link</span><br>`}<a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">Traži na YouTubeu</a>
           <input class="paste" id="ln_${lk}_${i}" data-set="${lk}:${i}" placeholder="Zalijepi link videa" inputmode="url">`;
      rows.push(`<tr><td>${id?`<input type="checkbox" id="rv_${lk}_${i}" data-id="${id}" ${excluded.has(id)?'':'checked'} aria-label="Uključi ${s.t}">`:''}</td>
        <td><b>${s.a}</b> – ${s.t} (${s.y})<br>${linkCell}<br><span class="src">${s.s}</span></td></tr>`);
    });
  }
  $("reviewBody").innerHTML = rows.join("");
  $("reviewBody").querySelectorAll("input[type=checkbox]").forEach(i => i.onchange = () => {
    i.checked ? excluded.delete(i.dataset.id) : excluded.add(i.dataset.id);
    store.set("pp_excluded",[...excluded]);
  });
  const songAt = ref => { const [lk,i] = ref.split(":"); return LISTS[lk].songs[+i]; };
  $("reviewBody").querySelectorAll("input.paste").forEach(i => i.oninput = () => {
    const id = parseYT(i.value);
    if (!id) return;
    links[keyOf(songAt(i.dataset.set))] = id; store.set("pp_links",links); renderReview();
  });
  $("reviewBody").querySelectorAll("button[data-clear]").forEach(b => b.onclick = () => {
    const k = keyOf(songAt(b.dataset.clear));
    delete links[k]; delete linkMeta[k]; store.set("pp_links",links); store.set("pp_linkmeta",linkMeta); renderReview();
  });
}
$("reviewBtn").onclick = () => {
  const names = shownLists().map(([,l]) => l.name);
  $("reviewScope").textContent = names.length ? `Prikazane liste: ${names.join(", ")}. Isključi pjesmu kvačicom ako je kriva verzija.` : "";
  renderReview(); show("reviewScreen");
};

/* ---------- LINKOVI S GITHUBA ----------
   links.json održava automatski posao na GitHubu (tools/fill-links.mjs): provjerava videe
   (obrisan, ugradnja zabranjena, blokiran u Hrvatskoj) i traži zamjene. Mobitel samo čita. */
fetch("links.json", {cache: "no-cache"})
  .then(r => r.ok ? r.json() : null)
  .then(j => { if (!j) return; server = {links: j.links || {}, blocked: j.blocked || {}};
               renderPick(); if (!$("reviewScreen").hidden) renderReview(); })
  .catch(() => {});
try{ localStorage.removeItem("pp_apikey"); localStorage.removeItem("pp_tried"); }catch(e){}   // ključ više ne živi na mobitelu
const shownLists = () => Object.entries(LISTS).filter(([k]) => selected.includes(k));
$("backBtn").onclick = () => { renderPick(); show("startScreen"); };
/* ---------- ZAKLJUČAVANJE: puni zaslon, bez gašenja ekrana, tipka Natrag traži potvrdu ---------- */
let wakeLock = null;
const inGame = () => !$("gameScreen").hidden;
async function keepAwake(){ try{ wakeLock = await navigator.wakeLock?.request("screen") }catch(e){} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState==="visible" && inGame()) keepAwake(); });
async function lockIn(){
  try{ await document.documentElement.requestFullscreen?.({navigationUI:"hide"}) }catch(e){}
  try{ await screen.orientation?.lock?.("portrait") }catch(e){}
  keepAwake();
  history.pushState({pp:"game"},"");
}
function askExit(){ $("exitVeil").hidden = false; }
window.addEventListener("popstate", () => { if (inGame()){ history.pushState({pp:"game"},""); askExit(); } });
$("menuBtn").onclick = askExit;
$("stayBtn").onclick = () => { $("exitVeil").hidden = true; };
$("leaveBtn").onclick = async () => {
  $("exitVeil").hidden = true;
  if(player&&ready) player.pauseVideo();
  try{ await wakeLock?.release() }catch(e){} wakeLock = null;
  try{ if(document.fullscreenElement) await document.exitFullscreen() }catch(e){}
  renderPick(); show("startScreen");
  if (pendingReload) location.reload();
};

/* ---------- RUNDE ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a }
let played = new Set(store.get("pp_played",[]));
function buildDeck(){
  const seen = new Set(played);
  deck = shuffle(selected.flatMap(k => playable(LISTS[k]))
    .filter(s => { const id=idOf(s); if(seen.has(id)) return false; seen.add(id); return true; })
    .map(s => { const m = eff(s); return {...s, id: m.id, ch: m.ch, v: m.v}; }));
}
function saveScore(){
  score.names=[$("nameA").value,$("nameB").value];
  store.set("pp_score",score);
  $("ptsA").textContent=score.a; $("ptsB").textContent=score.b; $("roundNo").textContent=score.round;
  $("giveA").textContent="+1 "+score.names[0]; $("giveB").textContent="+1 "+score.names[1];
  $("left").textContent = deck.length ? `još ${deck.length}` : "";
}
["nameA","nameB"].forEach(id => $(id).oninput = saveScore);
/* Imena timova na početnom ekranu (u igri se mogu mijenjati i dodirom na ime) */
function teamName(i){ return (score.names[i]||"").trim() || `Tim ${i+1}`; }
$("teamA").value = score.names[0]==="Tim 1" ? "" : score.names[0];
$("teamB").value = score.names[1]==="Tim 2" ? "" : score.names[1];
[["teamA",0],["teamB",1]].forEach(([id,i]) => $(id).oninput = () => {
  score.names[i] = $(id).value.trim() || `Tim ${i+1}`; store.set("pp_score",score);
});

function setUI(s){
  state = s;
  $("stopBtn").hidden = !(s==="playing" || s==="loading");
  $("revealBtn").hidden = s!=="stopped";
  $("resumeBtn").hidden = s!=="stopped";
  $("resumeBtn").textContent = "Nastavi pjesmu";
  $("award").hidden = s!=="revealed";
  $("answer").hidden = s!=="revealed";
  $("cover").classList.toggle("gone", s==="revealed");
  $("cover").classList.toggle("spin", s==="playing");
  const txt = {loading:["Učitavam pjesmu…",""], playing:["Svira!","Tko prvi zna, udara STOP."],
    stopped:["Stop!","Odgovor naglas. Pa Prikaži odgovor."], empty:["Sve pjesme su odigrane","Izbornik → Kreni → Nova igra, ili uključi još lista."]}[s];
  if (txt){ $("status").textContent=txt[0]; $("hint").textContent=txt[1]; }
  $("skipBtn").textContent = s==="revealed" ? "Nitko nije pogodio" : "Preskoči";
}

function nextSong(){
  if (!deck.length){ current=null; setUI("empty"); return; }
  current = deck.pop(); played.add(current.id); store.set("pp_played",[...played]); saveScore(); setUI("loading");
  try{ player.mute(); }catch(e){}            // početak pjesme se ne čuje dok ne skočimo na nasumično mjesto
  player.loadVideoById({videoId: current.id});
  clearTimeout(loadTimer);
  loadTimer = setTimeout(() => {             // Android ponekad blokira automatsko pokretanje
    if (state!=="loading") return;
    $("hint").textContent = "Pjesma nije krenula sama. Dodirni Pokreni pjesmu.";
    $("resumeBtn").hidden = false; $("resumeBtn").textContent = "Pokreni pjesmu";
  }, 4000);
}
function revealAnswer(){
  $("aArtist").textContent=current.a; $("aTitle").textContent=current.t;
  $("aMeta").textContent=`${current.y}${current.v?" · "+current.v:""} · ${current.s}`;
  setUI("revealed");
}
function award(team){
  if(team) score[team]++;
  score.round++; saveScore(); nextSong();
}

/* STOP reagira na dodir (pointerdown), ne na otpuštanje prsta: nema kašnjenja kad netko udari gumb */
function smash(e){
  if (e) e.preventDefault();
  if (state!=="playing" && state!=="loading") return;
  try{ player.pauseVideo(); }catch(_){}
  setUI("stopped");
  if (navigator.vibrate) navigator.vibrate(150);
}
$("stopBtn").addEventListener("pointerdown", smash);
$("stopBtn").addEventListener("keydown", e => { if (e.key==="Enter" || e.key===" ") smash(e); });
$("resumeBtn").onclick = () => {
  if (state==="loading"){ player.playVideo(); $("resumeBtn").hidden = true; return; }
  try{ player.unMute(); }catch(_){}
  player.playVideo(); setUI("playing");
};
$("revealBtn").onclick = revealAnswer;
$("giveA").onclick = () => award("a");
$("giveB").onclick = () => award("b");
$("skipBtn").onclick = () => state==="revealed" ? award(null) : (current ? nextSong() : null);

function beginGame(fresh){
  $("startVeil").hidden = true;
  if (fresh){ score.a = 0; score.b = 0; score.round = 1; played = new Set(); store.set("pp_played",[]); current = null; }
  buildDeck(); $("nameA").value=score.names[0]; $("nameB").value=score.names[1]; saveScore();
  show("gameScreen"); lockIn();
  if (ready) nextSong(); else setUI("loading");
}
$("startBtn").onclick = () => {
  if (!selected.length){ $("startBtn").textContent="Odaberi barem jednu listu"; setTimeout(()=>$("startBtn").textContent="Kreni",1500); return; }
  const unfinished = score.a + score.b > 0 || score.round > 1 || played.size > 0;
  if (!unfinished) return beginGame(true);
  $("startInfo").textContent = `${teamName(0)} ${score.a} : ${score.b} ${teamName(1)}, odigrano ${played.size} pjesama.`;
  $("startVeil").hidden = false;
};
$("newGameBtn").onclick = () => beginGame(true);
$("continueBtn").onclick = () => beginGame(false);

/* ---------- YOUTUBE ---------- */
let seeked = false, errStreak = 0, loadTimer = null, everPlayed = false;
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player("player", {
    playerVars:{playsinline:1, controls:0, disablekb:1, rel:0, modestbranding:1, fs:0, iv_load_policy:3},
    events:{
      onReady: () => { ready = true; if(!$("gameScreen").hidden && !current) nextSong(); },
      onStateChange: e => {
        if (e.data===YT.PlayerState.PLAYING){ errStreak = 0; everPlayed = true; }
        // STOP je pritisnut dok se pjesma još učitavala ili premotavala: drži je zaustavljenom
        if (e.data===YT.PlayerState.PLAYING && state==="stopped"){ player.pauseVideo(); return; }
        if (e.data===YT.PlayerState.PLAYING && state==="loading"){
          clearTimeout(loadTimer);
          if(!seeked){
            const d = player.getDuration();
            if (d > 90){ seeked = true; player.seekTo(20 + Math.random()*(d*0.6-20), true); }
          }
          setUI("playing");
          setTimeout(() => { if (state==="playing") try{ player.unMute(); }catch(_){} }, 350);
        }
        if (e.data===YT.PlayerState.UNSTARTED || e.data===YT.PlayerState.CUED) seeked = false;
      },
      // 100 = video ne postoji, 101/150 = vlasnik zabranio ugradnju, 2/5 = greška -> preskoči sam
      onError: e => {
        seeked = false; errStreak++;
        if (errStreak >= 3 && !everPlayed){ setUI("empty"); $("status").textContent="YouTube ne pušta pjesme";
          $("hint").textContent="Stranica vjerojatno nije otvorena preko web adrese (https). Otvori je s GitHub Pagesa ili svog servera."; return; }
        if (current && [100,101,150].includes(e.data)){ blocked[current.id] = {c:e.data, t:Date.now()}; store.set("pp_blocked",blocked); }
        nextSong();
      }
    }
  });
};
renderPick();
$("verLine").textContent = "Verzija " + APP_VERSION;

/* ---------- INSTALACIJA (ikona na početnom zaslonu) ---------- */
/* Nova verzija igre: service worker je preuzme i stranica se sama osvježi, ali nikad usred igre */
if ("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(r => r.update()).catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloading) return;
    if (inGame()){ pendingReload = true; return; }
    reloading = true; location.reload();
  });
}
let pendingReload = false;
let installPrompt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installPrompt = e; $("installBtn").hidden = false; });
$("installBtn").onclick = async () => {
  if (!installPrompt) return;
  installPrompt.prompt();
  const { outcome } = await installPrompt.userChoice.catch(() => ({}));
  installPrompt = null; $("installBtn").hidden = true;
  if (outcome !== "accepted") $("installBtn").hidden = true;
};
window.addEventListener("appinstalled", () => { $("installBtn").hidden = true; });
</script>
<script src="https://www.youtube.com/iframe_api"></script>
